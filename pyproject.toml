[project]
name = "kitchen-mcp"
version = "0.1.0"
description = "kitchen-agent의 도구를 에이전트별 MCP 서버(stdio)로 분리한 프로젝트"
readme = "README.md"
authors = [
    { name = "kiseh", email = "duwkdfh@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
    "fastembed==0.9.0",
    "numpy==2.5.4",
    "pydantic==2.14.1",
]

[project.scripts]
kitchen-mcp = "kitchen_mcp:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
